server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The *.gzip files under data/ are fetched as raw bytes and inflated in the
    # browser with DecompressionStream. They must go out without a
    # Content-Encoding header, so on-the-fly gzip is limited to text types.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
